name: Build rootfs images

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full rebuild+upload safety net catches mutable source_image drift
    # that git diffing cannot see.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild and upload every tenant image, ignoring change detection'
        type: boolean
        default: true

jobs:
  validate-config:
    # Validate the GitOps runtime config with the exact Firework enricher before
    # any expensive image build. Pin FIREWORK_CONFIG_REF to the core version
    # deployed to the nodes; do not validate against a floating main.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GitOps config
        uses: actions/checkout@v4

      - name: Check image push backend selection
        run: bash ./scripts/test-push-images.sh

      - name: Checkout Firework (pinned config contract)
        uses: actions/checkout@v4
        with:
          repository: artemnikitin/firework
          ref: d7c9596080210dadfb271d2ce9eb8543809f2e21
          path: .firework
          token: ${{ secrets.FIREWORK_GITHUB_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .firework/go.mod

      - name: Validate runtime config
        working-directory: .firework
        run: go run ./cmd/configcheck --require-remote-routing --input-dir "$GITHUB_WORKSPACE"

  build:
    needs: validate-config
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_platform: linux/arm64
            target_arch: arm64
            runner: ubuntu-24.04-arm
            yq_arch: arm64
          - target_platform: linux/amd64
            target_arch: amd64
            runner: ubuntu-24.04
            yq_arch: amd64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_REBUILD_INPUT: ${{ github.event.inputs.force_rebuild }}
        run: |
          FORCE_REBUILD=false
          COMPARE_BASE_SHA=""

          case "$EVENT_NAME" in
            schedule)
              # Weekly safety net: always rebuild to catch mutable tag drift.
              FORCE_REBUILD=true
              ;;
            workflow_dispatch)
              FORCE_REBUILD="${FORCE_REBUILD_INPUT:-true}"
              if [ "$FORCE_REBUILD" != "true" ]; then
                # No natural "since last build" SHA exists for a manual run;
                # use the dispatched commit's parent so unchecking force_rebuild
                # actually engages change detection instead of being a no-op.
                if PARENT_SHA="$(git rev-parse "HEAD^" 2>/dev/null)"; then
                  COMPARE_BASE_SHA="$PARENT_SHA"
                fi
              fi
              ;;
            pull_request)
              # Use the base SHA from the event payload directly instead of
              # `git fetch` + `merge-base`: it needs no remote-tracking ref to
              # exist locally, so it can't silently fail if actions/checkout's
              # fetch refspec doesn't populate origin/<base>.
              if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
                COMPARE_BASE_SHA="$BASE_SHA"
              fi
              ;;
            push)
              if [ -n "$BEFORE_SHA" ] && \
                 [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && \
                 git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                COMPARE_BASE_SHA="$BEFORE_SHA"
              fi
              ;;
          esac

          if [ "$FORCE_REBUILD" != "true" ] && [ -z "$COMPARE_BASE_SHA" ]; then
            echo "No usable comparison SHA for $EVENT_NAME; building every image."
          fi

          SHOULD_UPLOAD=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && \
             { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; }; then
            SHOULD_UPLOAD=true
          fi

          echo "FORCE_REBUILD=$FORCE_REBUILD" >> "$GITHUB_ENV"
          echo "COMPARE_BASE_SHA=$COMPARE_BASE_SHA" >> "$GITHUB_ENV"
          echo "SHOULD_UPLOAD=$SHOULD_UPLOAD" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq e2fsprogs

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${{ matrix.yq_arch }}
          sudo chmod +x /usr/local/bin/yq

      - name: Build per-tenant rootfs images (${{ matrix.target_platform }})
        env:
          TARGET_PLATFORM: ${{ matrix.target_platform }}
          FIREWORK_GITHUB_TOKEN: ${{ secrets.FIREWORK_GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ env.FORCE_REBUILD }}
          COMPARE_BASE_SHA: ${{ env.COMPARE_BASE_SHA }}
        run: make build

      # Both architectures publish to the same bucket per cloud, separated by an
      # <arch>/ key prefix that push-images.sh derives from TARGET_PLATFORM. The
      # agent reads the prefix matching its own node, so there is nothing
      # per-architecture to resolve here.
      - name: Upload images to S3
        if: env.SHOULD_UPLOAD == 'true' && vars.S3_IMAGES_BUCKET != ''
        env:
          TARGET_PLATFORM: ${{ matrix.target_platform }}
          S3_IMAGES_BUCKET: ${{ vars.S3_IMAGES_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: make push-s3

      - name: Authenticate to GCP
        if: env.SHOULD_UPLOAD == 'true' && vars.GCS_IMAGES_BUCKET != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Upload images to GCS
        # Gated identically to the credentials step above, so this never runs
        # without having authenticated.
        if: env.SHOULD_UPLOAD == 'true' && vars.GCS_IMAGES_BUCKET != ''
        env:
          TARGET_PLATFORM: ${{ matrix.target_platform }}
          GCS_IMAGES_BUCKET: ${{ vars.GCS_IMAGES_BUCKET }}
        run: make push-gcs
