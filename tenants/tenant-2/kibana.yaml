# Tenant-2 Kibana — premium tier, Elastic Stack 9.3.0
source_image: "docker.elastic.co/kibana/kibana:9.3.0"
rootfs_size_mb: 2048
node_type: "web"
vcpus: 2
memory_mb: 4096
# Keep the tenant-2 stack split across hosts when the cluster has capacity.
anti_affinity_group: "tenant-2"
kernel_args: "console=ttyS0 reboot=k panic=1 pci=off init=/sbin/fc-init /bin/tini -- /usr/local/bin/kibana-docker"
network: true
cross_node_links:
  - service: "elasticsearch"
    env: "ELASTICSEARCH_HOSTS"
    host_port: 9200
    protocol: "http"
port_forwards:
  - host_port: 5612
    vm_port: 5601
health_check:
  type: "http"
  port: 5601
  path: "/api/status"
  # Kibana 9.3 needs ~2 minutes to become ready in a 2-vCPU microVM; the
  # previous 15s x 5 window restarted the VM before first readiness, looping
  # forever. Keep the failure budget above the observed cold-start time.
  interval: "30s"
  timeout: "5s"
  retries: 5
env:
  TENANT_ID: "tenant-2"
metadata:
  tenant: "tenant-2"
  tier: "premium"
  version: "9.3.0"
  subdomain: "tenant-2"
