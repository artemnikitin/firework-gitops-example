# Tenant-1 Elasticsearch — standard tier, Elastic Stack 8.19.11
source_image: "docker.elastic.co/elasticsearch/elasticsearch:8.19.11"
rootfs_size_mb: 2048
node_type: "backend"
vcpus: 4
memory_mb: 4096
kernel_args: "console=ttyS0 reboot=k panic=1 pci=off init=/sbin/fc-init /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper"
network: true
port_forwards:
  - host_port: 9200
    vm_port: 9200
health_check:
  type: "http"
  port: 9200
  path: "/_cluster/health"
  interval: "15s"
  timeout: "10s"
  retries: 5
env:
  TENANT_ID: "tenant-1"
volumes:
  # Elasticsearch's data path is separated from its immutable rootfs. The
  # retained local volume stays bound to its first Firework node.
  - name: "data"
    type: "local"
    mount_path: "/usr/share/elasticsearch/data"
    size: "20Gi"
metadata:
  tenant: "tenant-1"
  tier: "standard"
  version: "8.19.11"
