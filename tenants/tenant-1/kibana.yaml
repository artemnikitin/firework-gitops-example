# Tenant-1 Kibana — standard tier, Elastic Stack 8.19.11
source_image: "docker.elastic.co/kibana/kibana:8.19.11"
rootfs_size_mb: 2048
node_type: "web"
vcpus: 2
memory_mb: 2048
kernel_args: "console=ttyS0 reboot=k panic=1 pci=off init=/sbin/fc-init /bin/tini -- /usr/local/bin/kibana-docker"
network: true
cross_node_links:
  - service: "elasticsearch"
    env: "ELASTICSEARCH_HOSTS"
    host_port: 9200
    protocol: "http"
port_forwards:
  - host_port: 5611
    vm_port: 5601
health_check:
  type: "http"
  port: 5601
  path: "/api/status"
  # Keep the failure budget above Kibana's observed cold-start time so a
  # healthy first boot is not recycled before it can answer readiness checks.
  interval: "30s"
  timeout: "5s"
  retries: 5
env:
  TENANT_ID: "tenant-1"
metadata:
  tenant: "tenant-1"
  tier: "standard"
  version: "8.19.11"
  subdomain: "tenant-1"
