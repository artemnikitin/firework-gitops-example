# Local persistent-volume smoke workload. Enable and verify the node-local
# storage pool on every deployed node before merging this configuration.
source_image: "alpine:3.21"
rootfs_size_mb: 256
node_type: "general"
vcpus: 1
memory_mb: 128
network: true
# fc-init mounts /data before starting this command. Preserve the sentinel on
# later boots so a restart can prove that the volume was reused.
kernel_args: 'console=ttyS0 reboot=k panic=1 pci=off init=/sbin/fc-init /bin/sh -- -c "test -f /data/sentinel || echo firework-volume-ok > /data/sentinel; echo ok > /data/health; exec busybox httpd -f -p 8080 -h /data"'
health_check:
  type: "http"
  port: 8080
  path: "/health"
  interval: "10s"
  timeout: "3s"
  retries: 3
volumes:
  - name: "data"
    type: "local"
    mount_path: "/data"
    size: "1Gi"
