# Copy this file to tenants/<tenant>/storage-validation.yaml after enabling
# local storage in the deployment. It is intentionally outside tenants/ so the
# default example remains storage-disabled.
source_image: "alpine:3.21"
rootfs_size_mb: 256
node_type: "general"
vcpus: 1
memory_mb: 128
# Linux's init-argument parser preserves double-quoted arguments. The outer
# YAML quotes are single quotes so /bin/sh receives the complete -c script as
# one argument.
kernel_args: 'console=ttyS0 reboot=k panic=1 pci=off init=/sbin/fc-init /bin/sh -- -c "echo firework-volume-ok > /data/sentinel; exec sleep infinity"'
volumes:
  - name: "data"
    type: "local"
    mount_path: "/data"
    size: "1Gi"
